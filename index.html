<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="BONSAY crea apps, páginas web, automatizaciones y soluciones de inteligencia artificial para empresas."
      data-i18n-content="meta.description"
    />
    <meta name="theme-color" content="#f4f4f1" />
    <title>BONSAY — Socio tecnológico</title>
    <link rel="icon" href="./assets/images/logoB-sinfondo.png" type="image/png" />
    <link rel="preload" href="./assets/fonts/space-grotesk-600.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="./assets/fonts/inter-400.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="accessibility.skip">Ir al contenido</a>

    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Inicio de BONSAY" data-i18n-aria-label="accessibility.home">
          <img src="./assets/images/logsinFondo.png" alt="BONSAY" />
        </a>

        <div class="language-switcher" role="group" aria-label="Seleccionar idioma" data-i18n-aria-label="accessibility.language">
          <button type="button" data-language="es" aria-pressed="true">ES</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-language="en" aria-pressed="false">EN</button>
        </div>
      </header>

      <main id="main-content" class="stage" aria-labelledby="page-title">
        <section class="intro" aria-label="BONSAY">
          <h1 id="page-title">
            <span data-i18n="hero.title">Creamos soluciones</span>
            <em data-i18n="hero.titleAccent">Que mueven negocios</em>
          </h1>
        </section>

        <aside class="info-rail">
          <section class="services-block" aria-labelledby="services-title">
            <p class="rail-label" id="services-title" data-i18n="services.title">Lo que hacemos</p>
            <ol class="service-list">
              <li><span>01</span><strong data-i18n="services.apps">Apps a medida</strong></li>
              <li><span>02</span><strong data-i18n="services.websites">Páginas web</strong></li>
              <li><span>03</span><strong data-i18n="services.automation">Automatización</strong></li>
              <li><span>04</span><strong data-i18n="services.ai">IA aplicada</strong></li>
            </ol>
          </section>

          <section class="clients-block" aria-labelledby="clients-title">
            <div class="rail-label clients-label">
              <span class="status-dot" aria-hidden="true"></span>
              <h2 id="clients-title" data-i18n="clients.title">Hemos trabajado con</h2>
            </div>
            <div class="client-logos">
              <figure>
                <img src="./assets/images/OasisEsperanza_Logo-02.png" alt="Oasis de Esperanza Atenas" width="1651" height="440" />
              </figure>
              <figure>
                <img src="./assets/images/Logo Ocupro 360 CMYK_Logo Ocupro 360 color RGB.png" alt="OcuPro 360" width="8000" height="2105" />
              </figure>
            </div>
          </section>
        </aside>
      </main>

      <div class="contact-band" role="group" aria-label="Contacto" data-i18n-aria-label="contact.ariaLabel">
        <span class="contact-prompt">
          <small data-i18n="contact.eyebrow">¿Tienes una idea?</small>
          <strong data-i18n="contact.action">Conversemos.</strong>
        </span>
        <a class="contact-link" href="mailto:grandres1224@gmail.com">
          <span class="contact-link-copy">
            <small class="contact-link-label">Email</small>
            <span class="contact-link-value">grandres1224@gmail.com</span>
          </span>
          <span class="contact-link-arrow" aria-hidden="true">↗</span>
        </a>
        <a
          class="contact-link"
          href="https://wa.me/50686716300?text=Hola%2C%20vi%20el%20sitio%20de%20BONSAY%20y%20quisiera%20conversar%20sobre%20un%20proyecto."
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="contact-link-copy">
            <small class="contact-link-label">WhatsApp</small>
            <span class="contact-link-value"><span class="contact-link-prefix">WhatsApp · </span>+506 8671 6300</span>
          </span>
          <span class="contact-link-arrow" aria-hidden="true">↗</span>
        </a>
      </div>

      <footer class="site-footer">
        <span>© <span data-year></span> BONSAY</span>
      </footer>
    </div>

    <script src="./assets/js/translations.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
